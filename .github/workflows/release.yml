name: Release Portable Zip

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RoosterAudioSwitcher.sln

      - name: Publish win-x64 portable
        run: >
          dotnet publish RoosterAudioSwitcher.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o publish/win-x64

      - name: Package zip and checksum
        id: package
        shell: pwsh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zipName = "RoosterAudioSwitcher-$version-win-x64-portable.zip"
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath $zipName -Force

          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          $checksumFile = "SHA256SUMS.txt"
          "$hash  $zipName" | Out-File -FilePath $checksumFile -Encoding ascii

          # Sign the checksum file with GPG if a signing key is available.
          # The key is provided via the GPG_PRIVATE_KEY repository secret, exposed
          # to this step as an environment variable (see env: above).
          if ($env:GPG_PRIVATE_KEY) {
            $gpgSignature = "SHA256SUMS.sig"
            Set-Content -Path "gpg-signing-key.asc" -Value $env:GPG_PRIVATE_KEY -NoNewline
            gpg --batch --import gpg-signing-key.asc
            Remove-Item gpg-signing-key.asc
            $keyId = (gpg --list-keys --with-colons | Select-String '^pub:' | ForEach-Object { $_.Line -split ':' })[4]
            gpg --batch --yes --armor --detach-sign --default-key $keyId -o $gpgSignature $checksumFile
            "signature_name=$gpgSignature" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum_name=$checksumFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_name }}
            ${{ steps.package.outputs.checksum_name }}
            ${{ steps.package.outputs.signature_name || '' }}
